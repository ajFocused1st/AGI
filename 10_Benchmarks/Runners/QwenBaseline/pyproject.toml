[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-qwen-baseline"
version = "0.1.0"
description = "Reproducible direct-model diagnostic baseline for AGI."
requires-python = ">=3.12"
dependencies = ["agi-ollama>=0.1.0", "agi-contracts>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
