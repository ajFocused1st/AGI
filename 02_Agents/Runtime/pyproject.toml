[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-agent-runtime"
version = "0.1.0"
description = "Injected orchestration runtime for governed agents"
requires-python = ">=3.12"
dependencies = [
  "agi-contracts>=0.1.0,<0.2.0",
  "agi-evaluation>=0.1.0,<0.2.0",
  "pydantic>=2.8,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
