[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-tools"
version = "0.1.0"
description = "Governed, low-risk tools for the AGI workspace"
requires-python = ">=3.11"
dependencies = [
    "agi-contracts>=0.1.0",
    "pydantic>=2.7,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
